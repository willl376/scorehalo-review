[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorehalo"
version = "0.0.1"
description = "Graphics-tolerant optical music recognition with pluggable recognition backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
scorehalo = "scorehalo.cli:main"

[tool.setuptools.packages.find]
include = ["scorehalo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
